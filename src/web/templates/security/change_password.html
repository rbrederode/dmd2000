<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · dmd2000</title><link rel="stylesheet" href="/styles.css"></head><body><main class="ui-login"><section class="zk-card panel"><h1>Change password</h1><form action="{{ url_for_security('change_password') }}" method="post">{{ change_password_form.hidden_tag() }}
<label class="zk-field">Current password{{ change_password_form.password(class_='zk-input', autocomplete='current-password') }}</label>
<label class="zk-field">New password{{ change_password_form.new_password(class_='zk-input', autocomplete='new-password') }}</label>
<label class="zk-field">Confirm new password{{ change_password_form.new_password_confirm(class_='zk-input', autocomplete='new-password') }}</label>
{% for field, errors in change_password_form.errors.items() %}{% for error in errors %}<p class="ui-auth-error" role="alert">{{ error }}</p>{% endfor %}{% endfor %}
<button class="zk-btn is-primary" type="submit">Change password</button></form><a href="/#access">Back to console</a></section></main></body></html>
